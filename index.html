<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خرید ارزان سکه</title>
  <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(to right, #003366, #0099cc, #001f3f);
            text-align: center;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            margin: auto;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
        }
        h2 {
            font-size: 24px;
        }
        .animated-text {
            font-size: 40px;
            font-weight: bold;
            margin: 10px 0;
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow {
            0% { text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff; }
            100% { text-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff; }
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }
        button {
            background: #00cc00;
            color: black;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #0099cc;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #00ccff;
        }
    </style>
    <script>
        function validateCode() {
            let code = document.getElementById("code").value.trim();

            if (code === "") {
                alert("لطفا کد ۸ رقمی را وارد کنید.");
                return;
            }

            let validationURL = `https://github.com/cinascorp/08/validateCode.php?code=${code}`;
            fetch(validationURL)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // اگر کد معتبر بود، پردازش ادامه یابد
                        redirectToPayment();
                    } else {
                        alert("این کد قبلاً استفاده شده است یا معتبر نیست.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("خطا در ارتباط با سرور.");
                });
        }

        function redirectToPayment() {
            let accId = document.getElementById("accId").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let amount = 1500;
            let spicialDiscount = 10;

            if (accId === "" || phone === "") {
                alert("لطفا شناسه کاربری و شماره موبایل خود را وارد کنید.");
                return;
            }

            let paymentURL = `https://playmafiaonline.com/payZp.php?accId=${accId}&pId=t&phone=${phone}&sd=${spicialDiscount}&amount=${amount}`;
            window.location.href = paymentURL;
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>🪙 یه پیشنهاد که نباید ردش کنی 🪙</h2>
        <div class="animated-text">پدرخوانده</div>
        <p>با **1500 تومان** تعداد **500 سکه** دریافت کنید</p>
        
        <input type="text" id="accId" placeholder="👤 شناسه کاربری">
        <input type="text" id="phone" placeholder="📞 شماره موبایل">
        <input type="text" id="code" placeholder="🔑 کد ۸ رقمی" maxlength="8">
        
        <button onclick="validateCode()">🪙 پرداخت 🪙</button>
        
        <div class="footer">Cinascorp Corporation Company</div>
    </div>
</body>
</html>
